<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FSK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="seats.css">
<style type="text/css">

    /* the one taken seat, Heute: it opens today's films,
       title ..... time, like the rows on Spielzeiten */
    .heute ul {
        margin: 0;
        padding: 0 var(--text-inset);
        list-style: none;
        font-size: var(--size-60);
        /* each film one row tall, in line with the seats */
        line-height: var(--row);
    }

    .opens > .heute {
        padding: 0;
    }

    /* the lines sit a little high in their rows, for more air under the
       last film before the next seats */
    .heute ul {
        position: relative;
        top: -8px;
    }

    .heute a {
        display: flex;
        align-items: baseline;
    }

    .heute a span:last-child {
        order: 2;
        white-space: nowrap;
    }

    .heute a::after {
        content: "........................................................................................................................................................................................................";
        order: 1;
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
    }

    /* the empty seats follow straight on from the Heute row */
    .filler {
        margin-top: 0;
    }

</style>
</head>
<body>

<h1 class="screen"><a href="index.html"><img src="../images/logo_vertical.png" alt="fsk"></a></h1>

<main>
    <div class="opens">
        <section class="heute" id="heute" data-seat="Heute">
            <ul>
            <li><a href="spielzeiten.html#d-2026-09-24"><span>Rose</span><span>17:45</span></a></li>
            <li><a href="spielzeiten.html#d-2026-09-24"><span>Eagles Of The Republic</span><span>18:00</span></a></li>
            <li><a href="spielzeiten.html#d-2026-09-24"><span>The North</span><span>19:45</span></a></li>
            <li><a href="spielzeiten.html#d-2026-09-24"><span>Mauern Aus Sand</span><span>20:30</span></a></li>
            </ul>
        </section>
    </div>
</main>
