<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FSK</title>
    <link rel="stylesheet" href="style.css">
<style type="text/css">

    /* menu fills the screen, legal links sit below it; on short screens the page scrolls instead of overlapping */
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
    }

    .menu {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: center;
        font-size: var(--size-120);
        line-height: 0.82;
    }

    .legal {
        padding-top: 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        gap: 0.5em;
        font-size: var(--size-60);
        line-height: 1;
    }

</style>
</head>
<body>

<nav class="menu">
    <ul>
        <li><a href="spielzeiten.html">Spielzeiten</a></li>
        <li>Vorschau</li>
        <li>Kontact</li>
        <li>Kino</li>
        <li>Schafsuche</li>
        <li>Tickets</li>
    </ul>
</nav>

<footer class="legal">
    <span>Impressum</span>
    <span>Datenschutz</span>
</footer>

</body>
</html>
