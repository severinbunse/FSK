<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FSK</title>
    <link rel="stylesheet" href="style.css">
<style type="text/css">

    body {
        padding: 0 6vw;
    }

    /* the first screen: logo (with the menu link beside it) at the top,
       a little more than the smaller golden section (38.2%) of the screen,
       today's screenings at the bottom */
    .screen {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
    }


    .logo {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        height: 46vh;
        height: 46dvh;
        padding-top: calc(6vw + env(safe-area-inset-top));
        box-sizing: border-box;
    }

    .logo img {
        display: block;
        height: 100%;
        width: auto;
    }

    /* Heute and the date set like the days on Spielzeiten */
    .today h2 {
        margin: 0;
        font-size: inherit;
        font-weight: normal;
        text-align: center;
    }

    .today {
        margin-top: auto;
        padding-bottom: calc(6vw + env(safe-area-inset-bottom));
        font-size: var(--size-60);
        line-height: var(--leading-display);
    }

    .menu-link {
        font-size: var(--size-72);
        line-height: var(--leading-menu);
    }

    /* SAVED FOR LATER: Menü as a button with only the top of a rounded outline.
       Not in use. To switch it on, change the link to class="menu-link outlined".
       Outline about as thick as the letter stems, its shadow is a black copy
       moved 2px like the text shadow. The capitals stick out ~0.03em above the
       line box and there is ~0.14em of empty space below the baseline, so the
       top padding is larger to make the space around the letters look even. */
    .menu-link.outlined {
        display: inline-block;
        padding: 0.19em 0.5em 0.02em;
        position: relative;
        isolation: isolate;
    }

    .menu-link.outlined::before,
    .menu-link.outlined::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 0.055em solid white;
        border-radius: 0.15em;
        /* keep only the top edge and the rounded corners (radius 0.15em) */
        -webkit-mask-image: linear-gradient(to bottom, black 0.15em, transparent 0.15em);
        mask-image: linear-gradient(to bottom, black 0.15em, transparent 0.15em);
        pointer-events: none;
    }

    .menu-link.outlined::after {
        z-index: -1;
        border-color: black;
        transform: translate(2px, 2px);
    }

</style>
</head>
<body>

<div class="screen">

<div class="logo">
    <img src="../images/logo_vertical.png" alt="fsk Kino">
    <a class="menu-link" href="menu.html">Menü</a>
</div>

<section class="today">
    <h2>Heute, Do. 28.5</h2>
    <ul class="leaders">
        <li><a href="spielzeiten.html#d-2026-05-28">Rose</a><span>17:45</span></li>
        <li><a href="spielzeiten.html#d-2026-05-28">Eagles Of The Republic</a><span>18:00</span></li>
        <li><a href="spielzeiten.html#d-2026-05-28">The North</a><span>19:45</span></li>
        <li><a href="spielzeiten.html#d-2026-05-28">Mauern Aus Sand</a><span>20:30</span></li>
    </ul>
</section>

</div>

</body>
</html>
