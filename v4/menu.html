    <title>FSK – Menü</title>
    <link rel="stylesheet" href="style.css">
<style type="text/css">

    /* menu fills the screen, legal links sit below it; on short screens the page scrolls instead of overlapping */
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
    }

    .menu {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: center;
        font-size: var(--size-120);
        line-height: var(--leading-menu);
    }

    .legal {
        padding-top: 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        gap: 0.5em;
        font-size: var(--size-60);
        line-height: var(--leading-display);
    }

</style>
</head>

</a>
